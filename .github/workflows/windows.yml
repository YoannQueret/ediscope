# Windows build: a portable zip (ediscope.exe + every DLL it needs), built with MSYS2 (UCRT64,
# MinGW-w64) - on every tag (attached to its GitHub release), or by hand from the Actions tab
name: Windows build

on:
  push:
    tags: ['*']
    branches: [windows]
  workflow_dispatch:

permissions:
  contents: write  # to attach the zip to the tag's release

jobs:
  windows:
    runs-on: windows-latest
    defaults:
      run:
        shell: msys2 {0}

    steps:
      # no CRLF conversion: MSYS2's git would otherwise see every file as modified ("-dirty" version)
      - name: Keep line endings
        shell: pwsh
        run: git config --global core.autocrlf false

      - uses: actions/checkout@v4
        with:
          fetch-depth: 0  # the whole history and the tags, for the version (git describe)

      - uses: msys2/setup-msys2@v2
        with:
          msystem: UCRT64
          update: true
          install: >-
            git
            zip
          pacboy: >-
            toolchain:p
            cmake:p
            ninja:p
            pkgconf:p
            qt6-base:p
            SDL2:p
            mpg123:p
            fdk-aac:p
            openssl:p
            libiconv:p

      - name: Configure
        run: cmake -S . -B build -G Ninja -DCMAKE_BUILD_TYPE=Release -DUSE_FDK-AAC=1

      - name: Build
        run: cmake --build build

      - name: Package
        run: |
          VERSION=$(git describe --tags --dirty)
          DIST=ediscope-$VERSION-windows-x64
          mkdir -p "$DIST"
          cp build/src/ediscope.exe "$DIST/"

          # Qt DLLs and plugins (platform, styles, image formats, TLS)
          WINDEPLOYQT=$(command -v windeployqt6 || command -v windeployqt || ls /ucrt64/share/qt6/bin/windeployqt*.exe 2>/dev/null | head -n 1)
          "$WINDEPLOYQT" --release --no-translations --no-system-d3d-compiler --no-opengl-sw "$DIST/ediscope.exe"

          # every other DLL from MSYS2 that the executable or a Qt plugin needs (SDL2, mpg123,
          # fdk-aac, OpenSSL, iconv, the MinGW runtime, ...)
          for f in $(find "$DIST" -name '*.exe' -o -name '*.dll'); do
            ldd "$f" | awk '/\/ucrt64\// {print $3}'
          done | sort -u | while read -r dll; do
            cp -n "$dll" "$DIST/"
          done

          cp COPYING README.md "$DIST/"
          zip -r "$DIST.zip" "$DIST"
          echo "DIST=$DIST" >> "$GITHUB_ENV"

      - uses: actions/upload-artifact@v4
        with:
          name: ${{ env.DIST }}
          path: ${{ env.DIST }}.zip

      - name: Attach to the release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: ${{ env.DIST }}.zip

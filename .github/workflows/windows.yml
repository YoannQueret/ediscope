# Windows build: one self-contained ediscope.exe (every library linked statically, Qt included),
# built with MSYS2 (UCRT64, MinGW-w64) - on every tag (attached to its GitHub release), or by hand
# from the Actions tab
name: Windows build

on:
  push:
    tags: ['*']
  workflow_dispatch:

permissions:
  contents: write  # to attach the executable to the tag's release

jobs:
  windows:
    runs-on: windows-latest
    defaults:
      run:
        shell: msys2 {0}

    steps:
      # no CRLF conversion: MSYS2's git would otherwise see every file as modified ("-dirty" version)
      - name: Keep line endings
        shell: pwsh
        run: git config --global core.autocrlf false

      - uses: actions/checkout@v4
        with:
          fetch-depth: 0  # the whole history and the tags, for the version (git describe)

      # actions/checkout turns the tag of a tag-triggered run into a lightweight one, which
      # "git describe" (used by CMake for the version) ignores - restore the annotated tags
      - name: Restore annotated tags
        shell: pwsh
        run: git fetch --force --tags origin

      - uses: msys2/setup-msys2@v2
        with:
          msystem: UCRT64
          update: true
          install: >-
            git
          # Qt (static) and every library it links - also those of plugins EDIScope doesn't use (WebP,
          # TIFF, ...): qt6-static is the whole of Qt, and doesn't pull them all in itself
          pacboy: >-
            toolchain:p
            cmake:p
            ninja:p
            pkgconf:p
            qt6-static:p
            libpng:p
            libjpeg-turbo:p
            freetype:p
            harfbuzz:p
            graphite2:p
            brotli:p
            bzip2:p
            zstd:p
            zlib:p
            pcre2:p
            md4c:p
            double-conversion:p
            libwebp:p
            libtiff:p
            xz:p
            libdeflate:p
            jbigkit:p
            lerc:p
            vulkan-headers:p
            SDL2:p
            mpg123:p
            fdk-aac:p
            openssl:p
            libiconv:p

      - name: Configure
        run: cmake -S . -B build -G Ninja -DCMAKE_BUILD_TYPE=Release -DUSE_FDK-AAC=1

      - name: Build
        run: cmake --build build

      - name: Package
        run: |
          VERSION=$(git describe --tags --dirty)
          EXE=ediscope-$VERSION-windows-x64.exe
          cp build/src/ediscope.exe "$EXE"

          # self-contained: only Windows' own DLLs may be needed, none from MSYS2
          ldd "$EXE"
          if ldd "$EXE" | grep -i '/ucrt64/'; then
            echo "::error::ediscope.exe still depends on MSYS2 DLLs (listed above)"
            exit 1
          fi

          echo "EXE=$EXE" >> "$GITHUB_ENV"

      - uses: actions/upload-artifact@v4
        with:
          name: ${{ env.EXE }}
          path: ${{ env.EXE }}

      - name: Attach to the release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: ${{ env.EXE }}
